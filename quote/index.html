      if (digits.length !== 10) { err.textContent = 'Please enter a 10-digit mobile number.'; phone.setAttribute('aria-invalid', 'true'); phone.focus(); return; }
      var payload = { ref: res.ref, score: res.score, grade: res.grade, flags: res.flags, phone: digits, textConsent: consent.checked, answers: { lane: A.lane, zip: A.zip, size: A.size, items: Array.from(A.items), when: A.when, date: A.date, days: Array.from(A.days), time: A.time, access: A.access, role: A.role, firstName: A.firstName, paid: A.paid } };
      try { console.log('[prototype] desktop callback payload (not sent anywhere):', JSON.stringify(payload)); } catch (e) {}
      panel.replaceChildren(el('p', { cls: 'body', text: "Got it. We'll get back to you within the hour, 7am to 9pm. After 9pm, first thing next morning.", attrs: { tabindex: '-1', id: 'dp-done' } }));
      var d = document.getElementById('dp-done'); if (d) d.focus();
    } } }, [
      el('div', { cls: 'field' }, [el('label', { text: 'Mobile number', attrs: { for: 'dp' } }), phone]), err,
      el('div', { cls: 'consent' }, [consent, el('label', { attrs: { for: 'dc' } }, [
        el('strong', { text: 'Text me about my job.' }),
        document.createTextNode(' I agree to receive service text messages from H&L Junk Removal & Hauling at the number above, about my quote and my job. Message frequency varies. Message and data rates may apply. Reply STOP to opt out or HELP for help. Consent is not a condition of purchase. See our '),
        el('a', { text: 'Privacy Policy', attrs: { href: '/privacy-policy/', target: '_blank', rel: 'noopener' } }), document.createTextNode(' and '),
        el('a', { text: 'Terms', attrs: { href: '/terms/', target: '_blank', rel: 'noopener' } }), document.createTextNode('.')])]),
      el('button', { cls: 'btn primary', text: 'Call me', attrs: { type: 'submit' } })]);
    panel.appendChild(form);
    var toggle = el('button', { cls: 'link', text: "I'm on a computer, call me instead", attrs: { type: 'button', 'aria-expanded': 'false', 'aria-controls': 'dpanel' }, on: { click: function () {
      var open = panel.hasAttribute('hidden');
      if (open) { panel.removeAttribute('hidden'); phone.focus(); } else { panel.setAttribute('hidden', ''); }
      toggle.setAttribute('aria-expanded', open ? 'true' : 'false'); } } });
    return [toggle, panel];
  }

  function jcOutcome(res) {
    var g = res.grade, sizeAB = A.size === 30, kids = [], head, body, small = null, extra = null, showCall = true, callLabel = 'Call now: ' + CFG.PHONE_DISPLAY;
    // QA 2026-11-14: show the biohazard copy at any grade. Before, a whole-house bio lead that scored under 45
    // got the small-pickup screen and was never told H&L does not do the biohazard part.
    var capBio = H.isWhole(A) && A.items.has('bio');
    if (capBio) {
      head = 'We can clear the contents.';
      body = "We don't do biohazard work, like human or animal waste, needles or heavy mold. A remediation or biohazard cleanup company handles that part first. We clear everything else. Send the text and we'll call or text you within the hour, 7am to 9pm, to walk you through the order.";
      callLabel = 'Call ' + CFG.PHONE_DISPLAY;
    } else if (g === 'A' && (A.lane === 'C' || A.size === 40)) {
      head = "Let's set up your free walkthrough.";
      body = "For a job this size we like to see it first. The walkthrough is free, and you get one written price. Send the text and we'll call or text you within the hour, 7am to 9pm, to pick a time.";
      if (CFG.VIDEO_WALKTHROUGH_ENABLED) extra = 'Out of town? We can do it by video call.';
      small = 'Big jobs are never billed by the hour.';
    } else if (g === 'A') {
      head = 'This is right in our wheelhouse.';
      body = sizeAB ? "Send photos or a short video of the whole space, and we'll call or text you within the hour, 7am to 9pm. If the photos can't show it, we'll set up a free walkthrough."
        : "Send us the text with your photos and we'll call or text you within the hour, 7am to 9pm. After 9pm, first thing next morning.";
      small = 'Your price is locked once we see the photos. If the load turns out different, you hear the new price before we lift anything.';
    } else if (g === 'B') {
      head = "Send the photos and we'll text you a locked price.";
      body = 'We reply within 1 hour, 7am to 9pm. That price is what you pay. If the load turns out different from the photos, we tell you before we lift anything.';
      callLabel = 'Call ' + CFG.PHONE_DISPLAY;
    } else {
      head = 'We can help with that.';
      body = CFG.ROUTE_DAY_ENABLED ? 'Smaller pickups go on our ' + CFG.ROUTE_DAY_LABEL + " route, when the truck is already near you. Send a photo and we'll text you the price and the date."
        : "For smaller pickups we fit you in when the truck is already near you. Send a photo and we'll text you the price and the soonest day.";
      extra = "Got anything else going? Add it to the photos and we'll price it all together.";
      showCall = false;
    }
    kids.push(el('h1', { text: head, attrs: { id: 'h1' } }), el('p', { cls: 'body', text: body }));
    if (extra) kids.push(el('p', { cls: 'body', text: extra }));
    var textA = null;
    var nameIn = el('input', { attrs: { id: 'fn', type: 'text', maxlength: '40', autocomplete: 'given-name', value: A.firstName } });
    function refreshLink() { textA.setAttribute('href', H.smsHref(H.textBody(A, res))); }
    nameIn.addEventListener('input', function () { A.firstName = nameIn.value.replace(/[^\p{L}\p{M}' -]/gu, '').slice(0, 40); refreshLink(); });
    textA = linkBtn('Text my answers and photos', H.smsHref(H.textBody(A, res)), 'primary js-text');
    kids.push(el('div', { cls: 'field' }, [el('label', { text: 'First name (optional)', attrs: { for: 'fn' } }), nameIn]),
      el('p', { cls: 'fine', text: 'Your phone opens a text to us with your answers filled in. Add 2 or 3 photos and hit send.' }), textA);
    if (showCall) kids.push(callBtn(callLabel));
    if (small) kids.push(el('p', { cls: 'fine', text: small }));
    if (CFG.DESKTOP_CALLBACK_ENABLED) kids = kids.concat(desktopPanel(res));
    else kids.push(el('p', { cls: 'fine', text: 'On a computer? Call ' + CFG.PHONE_DISPLAY + ', or text that number from your phone and mention ' + res.ref + '.' }));
    kids.push(el('p', { cls: 'fine', text: 'We reply within 1 hour, 7am to 9pm. After 9pm, first thing next morning.' }));
    return { kids: kids, text: H.textBody(A, res) };
  }

  function priceCard(size, pick) {
    var p = size === 20 ? CFG.prices.y20 : CFG.prices.y14;
    var rows = [['d1', '1 day', p.d1], ['wknd', size === 14 ? 'Weekend (call to book)' : 'Weekend', p.wknd], ['d3', '3 days', p.d3], ['d7', '7 days', p.d7]];
    var tb = el('tbody');
    rows.forEach(function (r) {
      tb.appendChild(el('tr', { cls: A.dDays === r[0] ? 'on' : '' }, [el('th', { text: r[1], attrs: { scope: 'row' } }), el('td', { text: r[2] == null ? 'Not offered' : H.money(r[2]) })]));
    });
    var kids = [el('h3', { text: size + '-yard dumpster' })];
    if (pick) kids.push(el('span', { cls: 'tag', text: 'Our pick for your job' }));
    kids.push(el('table', {}, [el('caption', { cls: 'sr', text: size + '-yard prices' }), tb]));
    return el('section', { cls: 'card' + (pick ? ' pick' : ''), attrs: { 'aria-label': size + '-yard dumpster prices' } }, kids);
  }
  function dumpsterOutcome(res) {
    var sz = H.suggestSize(A), fl = res.flags, kids = [el('h1', { text: "Here's your dumpster.", attrs: { id: 'h1' } })];
    kids.push(el('div', { cls: 'cards' }, [priceCard(14, sz === 14), priceCard(20, sz === 20)]));
    kids.push(el('p', { cls: 'body', text: 'Every price is the whole price: drop-off, your rental days and haul-off. No weight fee and no tonnage fee.' }));
    kids.push(el('p', { cls: 'fine', text: 'Extra days are ' + H.money(CFG.prices.extraDay) + " each, if the can isn't already booked." }));
    if (A.dDays === 'd1') kids.push(el('p', { cls: 'note', text: 'Need more time? For ' + H.money(H.nudge(A)) + ' more, you get 3 days.' }));
    var notes = { household: 'Most household jobs fit the 14.', remodel: 'Most remodel jobs fit the 14.',
      heavy: 'Heavy stuff goes in the 14. Keep it level with the top rail, and call or text us before you load concrete, brick, dirt, rock or shingles.', bigclean: 'A big cleanout usually wants the 20.' };
    kids.push(el('p', { cls: 'body', text: notes[A.dLoad] || '' }));
    if (fl.indexOf('street_houston') >= 0) kids.push(el('p', { cls: 'note', text: 'In the City of Houston a dumpster on the street needs a city permit, so we place on driveways.' }));
    if (A.dDays === 'wknd' && sz === 20) kids.push(el('p', { cls: 'note', text: 'The weekend rate is 14-yard only. The 20-yard starts at 1 day.' }));
    var hold = fl.indexOf('fcity') >= 0 && CFG.FCITY_MODE === 'hold';
    if (hold) {
      kids.push(el('p', { cls: 'body', text: "We'll confirm the drop-off for your address today. If you'd rather we load and haul it ourselves, we can price that now." }));
      kids.push(textBtn('Text us your address', 'Hi H&L, dumpster request. [' + res.ref + '] Address: ', 'primary'));
    } else if (A.dDays === 'wknd') {
      kids.push(callBtn('Call to book the weekend', 'primary'));
    } else {
      kids.push(linkBtn('Book online', CFG.BIN_BOSS_URL, 'primary js-shop-online', { target: '_blank', rel: 'noopener' }));
    }
    kids.push(textBtn('Text us a photo first', H.dumpsterBody(A, res)));
    kids.push(el('button', { cls: 'link', text: "Rather not load it yourself? We'll price the full haul.", attrs: { type: 'button' }, on: { click: function () {
      var keep = { zip: A.zip, paid: A.paid, src: A.src }; A = fresh(); A.zip = keep.zip; A.paid = keep.paid; A.src = keep.src; A.lane = 'J'; go('size'); } } }));
    return { kids: kids, text: H.dumpsterBody(A, res) };
  }

  RENDER.outcome = function () {
    var res = H.evaluate(A);
    var map = { DECLINE_AREA: 'x_area', DECLINE_HAZMAT: 'x_hazmat', DECLINE_BIO: 'x_bio', DECLINE_DEMO: 'x_demo' };
    if (map[res.grade]) return RENDER[map[res.grade]]();
    var out = A.lane === 'D' ? dumpsterOutcome(res) : jcOutcome(res);
    if (/[?&]debug=1(&|$)/.test(window.location.search)) out.kids.push(debugPanel(res, out.text));
    var band = A.lane === 'D' ? 'n/a' : (res.score < 50 ? '0-49' : (res.score < 75 ? '50-74' : '75-100'));
    track('intake_complete', { lane: A.lane, grade: res.grade, score_band: band });
    return wrap(out.kids);
  };

  document.addEventListener('click', function (e) {
    var t = e.target && e.target.closest ? e.target.closest('a') : null;
    if (!t) return;
    var cls = t.classList;
    // QA 2026-11-14: grade only when an outcome is on screen (a footer tap on screen 1 used to report grade 'C'),
    // and declines report their own code, e.g. 'decline_bio', as spec section 10 asks.
    var cur = trail[trail.length - 1], res = null;
    if (cur === 'outcome') { try { res = H.evaluate(A); } catch (x) {} }
    if (cls.contains('js-text-decline')) track('text_quote_click', { source: 'intake', grade: cur.indexOf('x_') === 0 ? 'decline_' + cur.slice(2) : 'decline' });
    else if (cls.contains('js-text')) { track('text_quote_click', { source: 'intake', grade: res ? res.grade : '' });
      /* Same Ads action as the site's text-quote.js ("Text Click (SMS)", secondary). That file is NOT loaded here,
         so this cannot double-fire. Decline links stay GA4 only so turned-away leads never reach Ads. */
      try { if (typeof window.gtag === 'function') window.gtag('event', 'conversion', { send_to: CFG.ADS_TEXT_LABEL, value: 75.0, currency: 'USD' }); } catch (x) {}
    }
    else if (cls.contains('js-call')) track('click_to_call', { source: 'intake' });
    else if (cls.contains('js-shop-online')) shopHandoff(t);
  });

  /* Bin Boss handoff, same rules as the script on /book/: carry the Google click id or utm_source to the
     storefront, and leave the hl_checkout marker that /booking-confirmed/ needs before it counts an order.
     Done on click because this link is built after page load. */
  function shopHandoff(a) {
    var href = a.getAttribute('href') || '';
    if (href.indexOf('mybinboss.com') === -1) return;
    function rd(k) { try { return sessionStorage.getItem(k) || ''; } catch (e) { return ''; } }
    function wr(k, v) { try { sessionStorage.setItem(k, v); } catch (e) {} }
    if (href.indexOf('utm_source=') === -1) {
      var p; try { p = new URLSearchParams(window.location.search); } catch (e) { p = null; }
      var clickKey = '', clickId = '';
      if (p) ['gclid', 'gbraid', 'wbraid'].forEach(function (k) { if (!clickId && p.get(k)) { clickKey = k; clickId = p.get(k); } });
      if (clickId) { wr('hl_click_id', clickKey + '=' + clickId); }
      else { var st = rd('hl_click_id'); if (st) { clickKey = st.slice(0, st.indexOf('=')); clickId = st.slice(st.indexOf('=') + 1); } }
      var src = p ? (p.get('utm_source') || '') : '', med = p ? (p.get('utm_medium') || '') : '';
      if (src) { wr('hl_src', src + '|' + med); }
      else { var s2 = rd('hl_src'); if (s2) { src = s2.slice(0, s2.indexOf('|')); med = s2.slice(s2.indexOf('|') + 1); } }
      var extra = href.indexOf('?') === -1 ? '?' : '&';
      if (clickId) extra += clickKey + '=' + encodeURIComponent(clickId) + '&utm_source=google&utm_medium=cpc';
      else if (src) extra += 'utm_source=' + encodeURIComponent(src) + '&utm_medium=' + encodeURIComponent(med || 'referral');
      else extra += 'utm_source=website&utm_medium=referral';
      extra += '&utm_campaign=dumpster&utm_content=quote';
      href += extra; a.setAttribute('href', href);
    }
    var now = String(new Date().getTime());
    wr('hl_checkout', now);
    try { localStorage.setItem('hl_checkout', now); } catch (e) {}
    try { if (typeof window.gtag === 'function') window.gtag('event', 'begin_checkout', { send_to: 'G-GYJ54HB3FE', link_url: href }); } catch (e) {}
  }

  show('lane');
  window.HLIntakeUI = { state: function () { return A; } };
})();
</script>
